<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Маленькая бетонная комната</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #000; }
  canvas { display: block; }
  #info {
    position: fixed; top: 15px; left: 15px; color: #cfcfcf;
    font-family: Arial, sans-serif; font-size: 14px;
    background: rgba(0,0,0,0.5); padding: 10px 15px; border-radius: 8px;
    pointer-events: none; z-index: 10;
  }
  #lock {
    position: fixed; inset: 0; display: flex; align-items: center;
    justify-content: center; color: #ddd; font-family: Arial, sans-serif;
    font-size: 22px; background: rgba(0,0,0,0.75); cursor: pointer; z-index: 20;
    text-align: center; padding: 20px;
  }

  /* ===== НОВОЕ: Кнопка переключения света ===== */
  #lightSwitch {
    position: fixed;
    top: 15px;
    right: 15px;
    z-index: 30;
    padding: 10px 18px;
    font-family: Arial, sans-serif;
    font-size: 14px;
    font-weight: bold;
    color: #111;
    background: #ffe07a;
    border: 2px solid #8a6b2f;
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(0,0,0,0.5), 0 0 20px rgba(255, 220, 100, 0.4);
    transition: all 0.2s;
    user-select: none;
  }
  #lightSwitch:hover { transform: translateY(-1px); }
  #lightSwitch:active { transform: translateY(0); }
  #lightSwitch.off {
    color: #cceeff;
    background: #1a3a5a;
    border-color: #4a8ab0;
    box-shadow: 0 3px 10px rgba(0,0,0,0.5), 0 0 20px rgba(100, 200, 255, 0.5);
  }

  /* ===== НОВОЕ: Руки ===== */
  #hands {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 5;
    overflow: hidden;
  }
  .hand {
    position: absolute;
    bottom: -60px;
    width: 240px;
    height: 340px;
    pointer-events: none;
    filter: drop-shadow(0 0 14px rgba(0,0,0,0.75));
    will-change: transform;
    transform-origin: bottom center;
  }
  .hand-left  { left: 2%; }
  .hand-right { right: 2%; }
  .hand-right svg { transform: scaleX(-1); }
  .hand svg { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>

<div id="info">WASD — ходить · Мышь — смотреть · Shift — быстрее · F — свет · ESC — выйти</div>

<!-- ===== НОВОЕ: Кнопка переключения света ===== -->
<button id="lightSwitch">💡 Свет ВКЛ</button>

<!-- ===== НОВОЕ: SVG-руки ===== -->
<div id="hands">
  <div class="hand hand-left" id="handLeft">
    <svg viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="skinGradL" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ecc39a"/>
          <stop offset="100%" stop-color="#c9a07a"/>
        </linearGradient>
        <linearGradient id="sleeveGradL" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#5a5a68"/>
          <stop offset="100%" stop-color="#2a2a35"/>
        </linearGradient>
      </defs>
      <!-- рукав -->
      <path d="M 35 300 L 35 210 Q 35 180 75 175 L 135 175 Q 175 180 175 210 L 175 300 Z"
            fill="url(#sleeveGradL)" stroke="#15151c" stroke-width="3" stroke-linejoin="round"/>
      <!-- кулак -->
      <path d="M 45 180 Q 30 130 70 95 Q 115 65 160 100 Q 190 140 175 185 Q 130 205 45 180 Z"
            fill="url(#skinGradL)" stroke="#7a5c40" stroke-width="3" stroke-linejoin="round"/>
      <!-- костяшки -->
      <ellipse cx="80"  cy="100" rx="12" ry="10" fill="#e0b48c" stroke="#7a5c40" stroke-width="2"/>
      <ellipse cx="110" cy="88"  rx="13" ry="11" fill="#e0b48c" stroke="#7a5c40" stroke-width="2"/>
      <ellipse cx="140" cy="92"  rx="13" ry="11" fill="#e0b48c" stroke="#7a5c40" stroke-width="2"/>
      <ellipse cx="165" cy="110" rx="11" ry="10" fill="#e0b48c" stroke="#7a5c40" stroke-width="2"/>
      <!-- большой палец -->
      <path d="M 55 165 Q 35 145 50 120 Q 65 105 82 125 Q 92 145 78 168 Z"
            fill="#e0b48c" stroke="#7a5c40" stroke-width="3"/>
    </svg>
  </div>
  <div class="hand hand-right" id="handRight">
    <svg viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="skinGradR" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ecc39a"/>
          <stop offset="100%" stop-color="#c9a07a"/>
        </linearGradient>
        <linearGradient id="sleeveGradR" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#5a5a68"/>
          <stop offset="100%" stop-color="#2a2a35"/>
        </linearGradient>
      </defs>
      <path d="M 35 300 L 35 210 Q 35 180 75 175 L 135 175 Q 175 180 175 210 L 175 300 Z"
            fill="url(#sleeveGradR)" stroke="#15151c" stroke-width="3" stroke-linejoin="round"/>
      <path d="M 45 180 Q 30 130 70 95 Q 115 65 160 100 Q 190 140 175 185 Q 130 205 45 180 Z"
            fill="url(#skinGradR)" stroke="#7a5c40" stroke-width="3" stroke-linejoin="round"/>
      <ellipse cx="80"  cy="100" rx="12" ry="10" fill="#e0b48c" stroke="#7a5c40" stroke-width="2"/>
      <ellipse cx="110" cy="88"  rx="13" ry="11" fill="#e0b48c" stroke="#7a5c40" stroke-width="2"/>
      <ellipse cx="140" cy="92"  rx="13" ry="11" fill="#e0b48c" stroke="#7a5c40" stroke-width="2"/>
      <ellipse cx="165" cy="110" rx="11" ry="10" fill="#e0b48c" stroke="#7a5c40" stroke-width="2"/>
      <path d="M 55 165 Q 35 145 50 120 Q 65 105 82 125 Q 92 145 78 168 Z"
            fill="#e0b48c" stroke="#7a5c40" stroke-width="3"/>
    </svg>
  </div>
</div>

<div id="lock">Нажмите, чтобы войти в комнату</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// --- Сцена, камера, рендер ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0b);

const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.05, 100);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// --- Размеры комнаты (маленькая!) ---
const ROOM_W = 6;
const ROOM_D = 6;
const HEIGHT = 2.6;

// --- Текстура бетона (процедурная, через canvas) ---
function makeConcreteTexture(size = 512, base = '#6a6a6a', spots = 4000) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');

  ctx.fillStyle = base;
  ctx.fillRect(0, 0, size, size);

  for (let i = 0; i < spots; i++) {
    const x = Math.random() * size;
    const y = Math.random() * size;
    const r = Math.random() * 1.6 + 0.3;
    const v = Math.floor(80 + Math.random() * 100);
    ctx.fillStyle = `rgba(${v},${v},${v},${Math.random() * 0.35})`;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  for (let i = 0; i < 40; i++) {
    const x = Math.random() * size;
    const y = Math.random() * size;
    const r = 20 + Math.random() * 80;
    const v = Math.floor(70 + Math.random() * 60);
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(${v},${v},${v},0.25)`);
    g.addColorStop(1, `rgba(${v},${v},${v},0)`);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = 8;
  return tex;
}

// --- Пол ---
const floorTex = makeConcreteTexture(512, '#7a7a7a', 6000);
floorTex.repeat.set(3, 3);
const floorMat = new THREE.MeshStandardMaterial({
  map: floorTex, color: 0x8a8a8a, roughness: 0.95, metalness: 0.0,
});
const floor = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_W, ROOM_D), floorMat);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

// --- Потолок ---
const ceilTex = makeConcreteTexture(512, '#5e5e5e', 4000);
ceilTex.repeat.set(2, 2);
const ceilMat = new THREE.MeshStandardMaterial({
  map: ceilTex, color: 0x6a6a6a, roughness: 1, metalness: 0
});
const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_W, ROOM_D), ceilMat);
ceiling.rotation.x = Math.PI / 2;
ceiling.position.y = HEIGHT;
scene.add(ceiling);

// --- Стены ---
const wallTex = makeConcreteTexture(1024, '#707070', 8000);
wallTex.repeat.set(2, 1);
const wallMat = new THREE.MeshStandardMaterial({
  map: wallTex, color: 0x808080, roughness: 0.95, metalness: 0
});

function makeWall(w, h, x, y, z, ry = 0) {
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(w, h), wallMat);
  wall.position.set(x, y, z);
  wall.rotation.y = ry;
  wall.receiveShadow = true;
  scene.add(wall);
}

makeWall(ROOM_W, HEIGHT, 0, HEIGHT / 2, -ROOM_D / 2, 0);
makeWall(ROOM_W, HEIGHT, 0, HEIGHT / 2,  ROOM_D / 2, Math.PI);
makeWall(ROOM_D, HEIGHT, -ROOM_W / 2, HEIGHT / 2, 0, Math.PI / 2);
makeWall(ROOM_D, HEIGHT,  ROOM_W / 2, HEIGHT / 2, 0, -Math.PI / 2);

// Плинтус
const skirtMat = new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 1 });
const skirtGeo = new THREE.BoxGeometry(ROOM_W, 0.12, 0.02);
[
  [0, 0.06, -ROOM_D / 2 + 0.02, 0],
  [0, 0.06,  ROOM_D / 2 - 0.02, 0],
].forEach(([x, y, z, ry]) => {
  const s = new THREE.Mesh(skirtGeo, skirtMat);
  s.position.set(x, y, z);
  s.rotation.y = ry;
  scene.add(s);
});
const skirtGeoZ = new THREE.BoxGeometry(ROOM_D, 0.12, 0.02);
[
  [-ROOM_W / 2 + 0.02, 0.06, 0],
  [ ROOM_W / 2 - 0.02, 0.06, 0],
].forEach(([x, y, z]) => {
  const s = new THREE.Mesh(skirtGeoZ, skirtMat);
  s.position.set(x, y, z);
  s.rotation.y = Math.PI / 2;
  scene.add(s);
});

// --- Освещение ---
const ambient = new THREE.AmbientLight(0x555566, 0.35);
scene.add(ambient);

const bulb = new THREE.PointLight(0xffddaa, 6, 12, 2);
bulb.position.set(0, HEIGHT - 0.15, 0);
bulb.castShadow = true;
bulb.shadow.mapSize.set(1024, 1024);
bulb.shadow.bias = -0.0005;
scene.add(bulb);

const bulbMesh = new THREE.Mesh(
  new THREE.SphereGeometry(0.06, 16, 16),
  new THREE.MeshBasicMaterial({ color: 0xffeec0 })
);
bulbMesh.position.copy(bulb.position);
scene.add(bulbMesh);

const cordMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
const cord = new THREE.Mesh(
  new THREE.CylinderGeometry(0.006, 0.006, 0.12, 6),
  cordMat
);
cord.position.set(0, HEIGHT - 0.06, 0);
scene.add(cord);

// --- Труба ---
const pipeMat = new THREE.MeshStandardMaterial({
  color: 0x4a4a4a, roughness: 0.7, metalness: 0.6
});
const pipe = new THREE.Mesh(
  new THREE.CylinderGeometry(0.05, 0.05, ROOM_W, 16),
  pipeMat
);
pipe.rotation.z = Math.PI / 2;
pipe.position.set(0, HEIGHT - 0.35, -ROOM_D / 2 + 0.4);
pipe.castShadow = true;
scene.add(pipe);

// --- Решётка вентиляции ---
const ventMat = new THREE.MeshStandardMaterial({
  color: 0x1a1a1a, roughness: 0.9, metalness: 0.4,
  emissive: 0x000000, emissiveIntensity: 0
});
const vent = new THREE.Mesh(
  new THREE.BoxGeometry(0.5, 0.35, 0.03),
  ventMat
);
vent.position.set(ROOM_W / 2 - 0.015, HEIGHT - 0.6, -1.5);
vent.rotation.y = -Math.PI / 2;
scene.add(vent);

// Прутья решётки
const ventBars = [];
for (let i = -3; i <= 3; i++) {
  const bar = new THREE.Mesh(
    new THREE.BoxGeometry(0.5, 0.02, 0.05),
    new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.7, roughness: 0.5 })
  );
  bar.position.set(ROOM_W / 2 - 0.015, HEIGHT - 0.6 + i * 0.045, -1.5);
  bar.rotation.y = -Math.PI / 2;
  scene.add(bar);
  ventBars.push(bar);
}

// --- Трещина на полу ---
const crackMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
const crack = new THREE.Mesh(new THREE.PlaneGeometry(2.2, 0.03), crackMat);
crack.rotation.x = -Math.PI / 2;
crack.rotation.z = Math.PI / 5;
crack.position.set(0.8, 0.011, 0.9);
scene.add(crack);


/* =========================================================
   ===== НОВОЕ #1: СВЕТ И ЛУЧИ ИЗ ВЕНТИЛЯЦИИ =====
   ========================================================= */

// Точечный свет из вентиляции (направленный прожектор вглубь комнаты)
const ventLight = new THREE.SpotLight(0x9fd8ff, 0, 18, Math.PI / 3.5, 0.55, 1.5);
ventLight.position.set(ROOM_W / 2 - 0.1, HEIGHT - 0.6, -1.5);
ventLight.target.position.set(-ROOM_W / 2, HEIGHT - 1.0, -1.5);
ventLight.castShadow = true;
ventLight.shadow.mapSize.set(1024, 1024);
ventLight.shadow.bias = -0.0005;
scene.add(ventLight);
scene.add(ventLight.target);

// Группа видимых лучей
const beamGroup = new THREE.Group();
beamGroup.visible = false;
scene.add(beamGroup);

// Мягкое общее свечение (конус)
const softBeamMat = new THREE.MeshBasicMaterial({
  color: 0xbbddff, transparent: true, opacity: 0.07,
  blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide
});
const softBeamGeo = new THREE.ConeGeometry(1.5, ROOM_W - 0.15, 24, 1, true);
const softBeam = new THREE.Mesh(softBeamGeo, softBeamMat);
softBeam.rotation.z = -Math.PI / 2; // конус направлен по -X
softBeam.position.set(-0.02, HEIGHT - 0.6, -1.5);
beamGroup.add(softBeam);

// Тонкие лучи из вентиляции до противоположной стены
const ventOrigin = new THREE.Vector3(ROOM_W / 2 - 0.1, HEIGHT - 0.6, -1.5);
const rayMat = new THREE.MeshBasicMaterial({
  color: 0xddeeff, transparent: true, opacity: 0.22,
  blending: THREE.AdditiveBlending, depthWrite: false
});

const NUM_RAYS = 9;
for (let i = 0; i < NUM_RAYS; i++) {
  const a = (i / NUM_RAYS) * Math.PI * 2;
  const spreadY = Math.cos(a) * 0.85;
  const spreadZ = Math.sin(a) * 0.85;

  const start = ventOrigin.clone();
  const end = new THREE.Vector3(
    -ROOM_W / 2 + 0.15,
    HEIGHT - 0.6 + spreadY,
    -1.5 + spreadZ
  );

  const dir = end.clone().sub(start);
  const len = dir.length();

  const rayGeo = new THREE.CylinderGeometry(0.028, 0.008, len, 6, 1, true);
  const ray = new THREE.Mesh(rayGeo, rayMat);

  const mid = start.clone().add(end).multiplyScalar(0.5);
  ray.position.copy(mid);

  const up = new THREE.Vector3(0, 1, 0);
  ray.quaternion.setFromUnitVectors(up, dir.clone().normalize());

  beamGroup.add(ray);
}


/* =========================================================
   ===== НОВОЕ #2: ПЕРЕКЛЮЧАТЕЛЬ СВЕТА =====
   ========================================================= */

let lightOn = true;
const lightBtn = document.getElementById('lightSwitch');

function toggleLight() {
  lightOn = !lightOn;

  if (lightOn) {
    // Свет включён — горит лампа, вентиляция тусклая
    bulb.intensity = 6;
    bulbMesh.material.color.setHex(0xffeec0);
    ambient.intensity = 0.35;
    ventLight.intensity = 0;
    beamGroup.visible = false;
    ventMat.emissive.setHex(0x000000);
    ventMat.emissiveIntensity = 0;
    lightBtn.textContent = '💡 Свет ВКЛ';
    lightBtn.classList.remove('off');
  } else {
    // Свет выключен — темнота, свет идёт из вентиляции
    bulb.intensity = 0;
    bulbMesh.material.color.setHex(0x222222);
    ambient.intensity = 0.06;
    ventLight.intensity = 14;
    beamGroup.visible = true;
    ventMat.emissive.setHex(0xaaddff);
    ventMat.emissiveIntensity = 1.2;
    lightBtn.textContent = '🔌 Свет ВЫКЛ';
    lightBtn.classList.add('off');
  }
}

lightBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  toggleLight();
});

// Клавиша F — работает и когда курсор захвачен
document.addEventListener('keydown', (e) => {
  if (e.code === 'KeyF') toggleLight();
});


/* =========================================================
   ===== НОВОЕ #3: ССЫЛКИ НА РУКИ ДЛЯ АНИМАЦИИ =====
   ========================================================= */
const handLeftEl  = document.getElementById('handLeft');
const handRightEl = document.getElementById('handRight');


// --- Управление от первого лица ---
const keys = {};
const PLAYER_RADIUS = 0.3;
const EYE_HEIGHT = 1.6;

const player = {
  pos: new THREE.Vector3(0, EYE_HEIGHT, 1.5),
  vel: new THREE.Vector3(),
  yaw: 0,
  pitch: 0,
  onGround: true
};

addEventListener('keydown', e => keys[e.code] = true);
addEventListener('keyup',   e => keys[e.code] = false);

const lockEl = document.getElementById('lock');
lockEl.addEventListener('click', () => renderer.domElement.requestPointerLock());

document.addEventListener('pointerlockchange', () => {
  lockEl.style.display = document.pointerLockElement === renderer.domElement ? 'none' : 'flex';
});

document.addEventListener('mousemove', e => {
  if (document.pointerLockElement !== renderer.domElement) return;
  player.yaw   -= e.movementX * 0.0022;
  player.pitch -= e.movementY * 0.0022;
  player.pitch = Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, player.pitch));
});

// --- Игровой цикл ---
const clock = new THREE.Clock();

function update(dt) {
  const speed = keys['ShiftLeft'] || keys['ShiftRight'] ? 3.5 : 1.8;

  const forward = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
  const right   = new THREE.Vector3(Math.cos(player.yaw), 0, -Math.sin(player.yaw));

  const move = new THREE.Vector3();
  if (keys['KeyW'] || keys['ArrowUp'])    move.add(forward);
  if (keys['KeyS'] || keys['ArrowDown'])  move.sub(forward);
  if (keys['KeyD'] || keys['ArrowRight']) move.add(right);
  if (keys['KeyA'] || keys['ArrowLeft'])  move.sub(right);

  if (move.lengthSq() > 0) move.normalize().multiplyScalar(speed);

  player.vel.x = move.x;
  player.vel.z = move.z;

  player.pos.x += player.vel.x * dt;
  player.pos.z += player.vel.z * dt;

  const limX = ROOM_W / 2 - PLAYER_RADIUS;
  const limZ = ROOM_D / 2 - PLAYER_RADIUS;
  player.pos.x = Math.max(-limX, Math.min(limX, player.pos.x));
  player.pos.z = Math.max(-limZ, Math.min(limZ, player.pos.z));

  camera.position.copy(player.pos);
  camera.rotation.order = 'YXZ';
  camera.rotation.y = player.yaw;
  camera.rotation.x = player.pitch;

  const t = clock.getElapsedTime();
  camera.position.y += Math.sin(t * 1.5) * 0.008;

  /* ===== НОВОЕ: анимация рук при ходьбе ===== */
  const walking = move.lengthSq() > 0;
  const bobFreq   = walking ? 9 : 1.5;
  const bobAmpY   = walking ? 11 : 2;
  const bobAmpX   = walking ? 6  : 1;
  const swingAmp  = walking ? 5  : 1;

  const bobY  = Math.sin(t * bobFreq) * bobAmpY;
  const bobX  = Math.sin(t * bobFreq * 0.5) * bobAmpX;
  const swing = Math.sin(t * bobFreq) * swingAmp;

  handLeftEl.style.transform  =
    `rotate(${-8 + swing}deg) translate(${bobX}px, ${bobY}px)`;
  handRightEl.style.transform =
    `rotate(${ 8 - swing}deg) translate(${-bobX}px, ${bobY}px)`;
}

function animate() {
  const dt = Math.min(clock.getDelta(), 0.1);
  update(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
